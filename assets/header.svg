<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hong Ji Ho - Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#141d45"/>
      <stop offset="1" stop-color="#2a1a58"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9c0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a45cff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9db4ff" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, 22px); } }
    @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-36px, -18px); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .gA { animation: driftA 9s ease-in-out infinite; }
    .gB { animation: driftB 11s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }



  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="gA" cx="200" cy="40" r="260" fill="url(#glowA)"/>
    <circle class="gB" cx="1010" cy="300" r="300" fill="url(#glowB)"/>

    <!-- left: identity -->
    <g class="sans">
      <text class="in1" x="72" y="104" font-size="17" font-weight="700" letter-spacing="7" fill="#8fb0ff">BACKEND DEVELOPER</text>
      <text class="in2" x="70" y="184" font-size="74" font-weight="800" fill="url(#title)">Hong Ji Ho</text>
      <rect class="in2" x="72" y="204" width="84" height="5" rx="2.5" fill="url(#accent)"/>
      <text class="in3" x="72" y="248" font-size="22" fill="#d4dcff">상태와 예외를 끝까지 검증하는 백엔드 개발자</text>
      <text class="in4" x="72" y="282" font-size="15" fill="#8f9cc9" letter-spacing="1">Spring Boot  ·  JPA  ·  Redis  ·  MSA  ·  Reliability</text>
    </g>

    <!-- right: code window -->
    <g transform="translate(716,62)"><g class="in3">
      <rect width="432" height="196" rx="14" fill="#0c1230" stroke="#3c4c8c" stroke-opacity="0.75"/>
      <path d="M0 14 A14 14 0 0 1 14 0 H418 A14 14 0 0 1 432 14 V36 H0 Z" fill="#141d43"/>
      <circle cx="22" cy="18" r="5" fill="#ff6b6b"/>
      <circle cx="40" cy="18" r="5" fill="#ffd166"/>
      <circle cx="58" cy="18" r="5" fill="#4ade80"/>
      <text class="mono" x="86" y="22" font-size="12" fill="#7885b8">PaymentService.java</text>
      <g class="mono" font-size="14.5">
        <text x="24" y="68" fill="#82aaff">@Transactional</text>
        <text x="24" y="92"><tspan fill="#c792ea">public void</tspan><tspan fill="#e6edff"> approve(Payment p) {</tspan></text>
        <text x="44" y="118"><tspan fill="#e6edff">p.assertStatus(</tspan><tspan fill="#f7b267">DEPOSIT_WAITING</tspan><tspan fill="#e6edff">);</tspan></text>
        <text x="44" y="142" fill="#e6edff">p.approve();<tspan fill="#6c7aa8">  // @Version 낙관적 락</tspan></text>
        <text x="24" y="168" fill="#e6edff">}</text>
        <rect class="caret" x="40" y="172" width="8" height="2.5" fill="#7fb0ff"/>
      </g>
    </g></g>
  </g>
</svg>
